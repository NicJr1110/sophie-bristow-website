# Redeploys the Sanity Studio (sophie-bristow.sanity.studio) whenever studio code changes on main.
# The website itself is deployed separately by Cloudflare Pages.
#
# One-off setup in GitHub → Settings → Secrets and variables → Actions:
#   Secrets tab:   SANITY_AUTH_TOKEN          (Sanity token with "Deploy Studio" permission)
#   Variables tab: SANITY_STUDIO_PROJECT_ID   (the project ID; not secret, it's in every image URL)

name: Deploy Sanity Studio

on:
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - '.github/workflows/deploy-studio.yml'
  workflow_dispatch: # "Run workflow" button in the Actions tab, for a manual redeploy

concurrency:
  group: deploy-studio
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    env:
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
      SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
      SANITY_STUDIO_DATASET: production
      SANITY_STUDIO_SITE_URL: https://sophiebristow.com
    steps:
      - name: Check setup
        run: |
          missing=0
          if [ -z "$SANITY_AUTH_TOKEN" ]; then echo "::error::Add the SANITY_AUTH_TOKEN secret (Settings → Secrets and variables → Actions → Secrets)."; missing=1; fi
          if [ -z "$SANITY_STUDIO_PROJECT_ID" ]; then echo "::error::Add the SANITY_STUDIO_PROJECT_ID variable (Settings → Secrets and variables → Actions → Variables)."; missing=1; fi
          exit $missing

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install
        run: npm ci

      - name: Build and deploy
        run: npx sanity deploy --yes
