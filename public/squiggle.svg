<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 16" preserveAspectRatio="none">
  <!-- Hand-drawn crayon underline: a slightly wobbly stroke with a rough, broken edge -->
  <defs>
    <filter id="crayon" x="-5%" y="-50%" width="110%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feComponentTransfer in="n" result="grain"><feFuncA type="discrete" tableValues="0 1 1 1 1 1 1"/></feComponentTransfer>
      <feComposite in="d" in2="grain" operator="in"/>
    </filter>
  </defs>
  <path d="M3 9.5 C 22 6.5, 38 11.5, 58 8.5 S 96 6, 118 9.5 S 158 11.5, 178 8 S 194 7.5, 197 8.5"
        fill="none" stroke="#1a1a1a" stroke-width="2.6" stroke-linecap="round" filter="url(#crayon)"/>
</svg>
