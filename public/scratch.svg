<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 12" preserveAspectRatio="none">
  <!-- A single thin crayon scratch: slightly rising, uneven pressure, broken by paper grain -->
  <defs>
    <filter id="crayon" x="-5%" y="-100%" width="110%" height="300%">
      <feTurbulence type="fractalNoise" baseFrequency="1.4 0.6" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feTurbulence type="fractalNoise" baseFrequency="2.2 0.9" numOctaves="1" seed="3" result="g"/>
      <feComponentTransfer in="g" result="grain"><feFuncA type="discrete" tableValues="0 0 1 1 1 1 1 1"/></feComponentTransfer>
      <feComposite in="d" in2="grain" operator="in"/>
    </filter>
  </defs>
  <g fill="none" stroke="#1a1a1a" stroke-linecap="round" filter="url(#crayon)">
    <path d="M4 8.2 C 40 7.4, 80 7.6, 120 6.6 S 200 5.2, 236 4.4" stroke-width="1.5"/>
    <path d="M30 7.9 C 70 7.3, 110 7, 150 6.1 S 205 5.1, 228 4.9" stroke-width="0.7" opacity="0.6"/>
  </g>
</svg>
